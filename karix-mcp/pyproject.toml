[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "karix-mcp"
version = "1.0.0"
description = "Karix WhatsApp Messaging MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.29.0",
    "starlette>=0.37.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
karix-mcp = "karix_mcp.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["karix_mcp*"]
