# Test profile — all external services are replaced by Testcontainers or mocks
spring:
  jpa:
    hibernate:
      ddl-auto: validate         # Flyway owns the schema — Hibernate only validates
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# JWT test keys — RSA 2048 key pair for tests only, never used in production.
# JwtService reads file paths (jwt.*-key-path); paths are relative to the backend module root.
jwt:
  private-key-path: src/test/resources/keys/jwt-private.pem
  public-key-path: src/test/resources/keys/jwt-public.pem

meta:
  api:
    token: test-meta-token
    base-url: http://localhost  # overridden by MockBean in tests
    version: "2.0.0"
  graph:
    base-url: http://localhost  # overridden by MockBean in tests
    version: v19.0
  thread-control:
    token: test-meta-token
    base-url: http://localhost  # overridden by MockBean in tests
    version: "1.0.0"
  webhook:
    verify-token: test-verify-token
    app-secret: test-only-secret-never-used-in-prod

claude:
  api:
    key: test-claude-key
    base-url: http://localhost  # overridden by MockBean in tests

security:
  bcrypt:
    cost: 4  # Low cost for fast tests — never use in production

crypto:
  # Fixed test-only key (32 bytes base64) — never used outside this profile.
  master-key: dGVzdC1vbmx5LWtleS1uZXZlci11c2UtaW4tcHJvZCE=

karix-mcp:
  base-url: http://localhost  # not called in tests — TemplateStudioClient is @MockBean'd

karix:
  send-base-url: http://localhost  # not called in tests — KarixMessagingClient is @MockBean'd where used

nvidia:
  api:
    base-url: http://localhost  # not called in tests

logging:
  level:
    com.metaagent: DEBUG
    org.springframework.security: WARN
    org.flywaydb: WARN
